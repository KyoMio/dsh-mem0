# dsh-mem0 bundle patch: inserts the host-side plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
#   dsh plugin --profile web add link:<path-to-this-package>
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (mem0 REST client + agent tools + system-prompt
# announcement); the browser half (exports "./client", served at
# /plugins/dsh-mem0/client.js) registers the row's Configure page on the
# official Plugins page (`plugins.row.config`, keyed dsh-mem0#dsh-mem0).
#
# The entry id MUST stay `dsh-mem0`: the Plugins page addresses this plugin's
# configuration form by the profile entry id, and the one-time import of the
# legacy ~/.dsh/settings.yaml writes each section into the entry of the same
# id (the dsh-mem0 section there: baseUrl / apiKey / authType / defaults /
# timeoutMs / announceToAgent / enabled — all accepted by the volatile Config
# in src/config.ts).
- insert:
    - id: dsh-mem0
      name: 'dsh-mem0'
